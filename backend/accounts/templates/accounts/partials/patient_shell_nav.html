{# nav_active: dashboard | compte (page Profil) | rdv | ordonnances #}
<aside class="pdash__side" aria-label="Navigation">
  <div class="pdash__brand">
    <div class="pdash__logo">
      <span class="pdash__logo-ico" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M12 21s-6.5-4.35-9-8.5C.5 8.5 2 5 5.5 5c2.2 0 4 1.45 4.5 3.5.5-2.05 2.3-3.5 4.5-3.5 3.5 0 5 3.5 2.5 7.5C14.5 16.65 12 21 12 21Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </span>
      <span>CardioSoin</span>
    </div>
    <p class="pdash__brand-tag">Espace patient</p>
  </div>
  <nav class="pdash__nav">
    <a class="pdash__nav-item{% if nav_active == 'dashboard' %} ap-active{% endif %}" href="{% url 'patient_space' %}">
      <span class="pdash__nav-ico" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      </span>
      Tableau de bord
    </a>
    <a class="pdash__nav-item{% if nav_active == 'compte' %} ap-active{% endif %}" href="{% url 'patient_profil' %}">
      <span class="pdash__nav-ico" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M20 21a8 8 0 0 0-16 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="1.5"/></svg>
      </span>
      Profil
    </a>
    <a class="pdash__nav-item" href="{% url 'landing' %}">
      <span class="pdash__nav-ico" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.5"/></svg>
      </span>
      Site public
    </a>
    <a class="pdash__nav-item{% if nav_active == 'rdv' %} ap-active{% endif %}" href="{% url 'patient_rendez_vous' %}">
      <span class="pdash__nav-ico" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M3 9h18M8 5V3M16 5V3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </span>
      Rendez-vous
    </a>
    <a class="pdash__nav-item{% if nav_active == 'ordonnances' %} ap-active{% endif %}" href="{% url 'patient_ordonnances' %}">
      <span class="pdash__nav-ico" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M7 3h10v18l-5-3-5 3V3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M9 7h6M9 11h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </span>
      Documents PDF
    </a>
  </nav>
  <div class="pdash__side-foot">
    <a class="pdash__nav-item pdash__nav-item--logout danger" href="{% url 'logout' %}">
      <span class="pdash__nav-ico" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M10 7V5a2 2 0 0 1 2-2h7v18h-7a2 2 0 0 1-2-2v-2M3 12h12M6 9l-3 3 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      Déconnexion
    </a>
  </div>
</aside>
